<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스킬 올리기 · 내 성장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#14171c; --ink2:#4b5260; --ink3:#9aa1ad; --line:#e8eaee; --bg:#fff; --soft:#f5f6f8;
  --blue:#2b5cff; --blue-soft:#eaf0ff;
  --night:#0a1226; --night2:#121c3a;
  --font:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:minmax(380px,1fr) minmax(340px,.85fr) minmax(520px,1.35fr);height:100%}
.pane{overflow:auto;position:relative}
.pane.l{padding:36px 40px 60px;border-right:1px solid var(--line)}
.pane.m{padding:36px 36px 60px;border-right:1px solid var(--line)}
.pane.r{background:radial-gradient(rgba(43,92,255,.13) 1px,transparent 1.5px) 0 0/22px 22px,linear-gradient(180deg,#f3f6fd,#e9eefb);color:var(--ink);padding:28px 32px 36px;display:flex;flex-direction:column;align-items:center}

/* left */
.who{display:flex;align-items:center;gap:14px}
.who .av{width:48px;height:48px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;overflow:hidden}
.who b{font-size:18px;display:block}
.who small{color:var(--ink2);font-size:13px}
.pts{font-size:64px;font-weight:300;letter-spacing:-2px;margin:26px 0 6px;font-variant-numeric:tabular-nums}
.pts i{font-style:normal;font-size:24px;margin-left:4px;color:var(--ink2)}
.rank{color:var(--ink2);font-size:15px;line-height:1.6}
.rank em{font-style:normal;background:var(--blue-soft);color:var(--blue);font-weight:600;padding:2px 8px;border-radius:6px}
.chips{display:flex;gap:8px;margin-top:14px}
.chip{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink2)}
.chip b{color:var(--blue);margin-left:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:36px 0 10px;font-weight:700;font-size:15px}
.sec small{font-weight:400;color:var(--ink3);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:17px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;text-align:left;position:relative}
.row.on{color:var(--blue)}
.row.on::before{content:"";position:absolute;left:-40px;top:0;bottom:0;width:3px;background:var(--blue)}
.row span.p{font-size:14px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .tag{color:var(--blue);font-size:12px;margin-left:8px;font-weight:600}
.row.bump span.p{animation:pop .6s}
@keyframes pop{30%{transform:scale(1.35);color:var(--blue)}}

/* middle */
.crumb{font-size:12px;color:var(--ink3);letter-spacing:.04em}
.h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:10px 0 18px}
.sp{font-size:60px;font-weight:300;letter-spacing:-2px;display:flex;justify-content:space-between;align-items:flex-end;font-variant-numeric:tabular-nums}
.sp i{font-style:normal;font-size:20px}
.sp small{font-size:12px;color:var(--ink2);text-align:right;line-height:1.5;font-weight:400;letter-spacing:0}
.cta{margin:20px 0;width:100%;background:var(--blue);color:#fff;border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.cta b{display:block;font-size:17px}.cta small{opacity:.85;font-size:13px}
.cta .ar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:18px}
.cta:disabled{background:var(--soft);color:var(--ink3);cursor:default}
.lec{display:flex;align-items:center;gap:14px;width:100%;padding:15px 0;border-bottom:1px solid var(--line);text-align:left;position:relative;overflow:hidden}
.lec .pl{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none;color:var(--ink2)}
.lec.next .pl{background:var(--blue);border-color:var(--blue);color:#fff}
.lec b{flex:1;font-size:15px}
.lec span{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.lec.done b{color:var(--ink3);text-decoration:line-through}
.lec.done .pl{background:var(--soft);color:var(--blue)}
.lec .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--blue)}
.lec.busy .fill{animation:fill .7s linear forwards}
@keyframes fill{to{width:100%}}
.rec{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.rec small{display:block;font-weight:400;color:var(--ink2);font-size:12px;margin-top:2px}

/* right */
.top{display:flex;justify-content:space-between;align-items:flex-start;width:100%;max-width:640px}
.eyebrow{font-size:10px;letter-spacing:.2em;color:#7a869f;font-family:ui-monospace,Menlo,monospace}
.top h2{font-size:22px;margin-top:4px}
.top p{font-size:12px;color:#6b7487;margin-top:2px}
.seg{display:flex;background:rgba(20,23,28,.06);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:12px;color:#6b7487}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,23,28,.12)}
.pet{width:100%;max-width:640px;margin:18px 0 6px;display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px -10px rgba(43,92,255,.25);border-radius:18px;padding:12px 18px 12px 12px}
.pet .stage{width:92px;height:92px;flex:none;position:relative}
.pet .stage svg{width:100%;height:100%;overflow:visible}
.pet .info{flex:1;min-width:0}
.pet .lv{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.06em}
.pet .nm{font-size:17px;font-weight:700;margin:2px 0 8px}
.bar{height:8px;border-radius:99px;background:#e6ebf5;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b86ff,#9ec0ff);border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pet .nx{font-size:12px;color:var(--ink2);margin-top:6px}
.bubble{position:absolute;left:50%;top:-6px;transform:translate(-50%,0);background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:4px 9px;border-radius:99px;opacity:0;pointer-events:none;white-space:nowrap}
.bubble.go{animation:bub 1.2s ease-out}
@keyframes bub{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.ch{transform-origin:50% 90%;animation:idle 2.6s ease-in-out infinite}
.ch.jump{animation:jump .7s}
@keyframes idle{50%{transform:translateY(-3px) scaleY(1.02)}}
@keyframes jump{30%{transform:translateY(-16px) scale(1.08,.94)}60%{transform:translateY(0) scale(.96,1.05)}}

.view{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding-top:6px}
.hint{font-size:12px;color:#7a869f;margin-top:14px}

/* card */
.scene{perspective:1400px;width:min(340px,100%);}
.card3d{position:relative;width:100%;aspect-ratio:55/90;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);will-change:transform}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:16px;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);box-shadow:0 28px 50px -22px rgba(30,50,110,.45),0 2px 6px rgba(30,50,110,.08),0 0 0 1px var(--edge) inset}
.face.back{transform:rotateY(180deg)}
.shine{position:absolute;inset:0;pointer-events:none;border-radius:inherit;mix-blend-mode:color-dodge;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.55),transparent 45%),
  linear-gradient(115deg,transparent 20%,rgba(255,80,200,.25) 35%,rgba(80,200,255,.25) 50%,rgba(255,240,120,.25) 65%,transparent 80%)}
.tier-4 .shine,.tier-5 .shine{opacity:.55}
.tier-3 .shine{opacity:.18}
.card3d.tier-1{--paper:#fbfaf7;--edge:#e5e2da}
.card3d.tier-2{--paper:#f6f1e6;--edge:#dfd5bd}
.card3d.tier-3{--paper:#f3eee2;--edge:#cdbf98}
.card3d.tier-4{--paper:#eef1f8;--edge:#9fb4e8}
.card3d.tier-5{--paper:#fbf3dc;--edge:#e3b94e}
.fh{display:flex;justify-content:space-between;align-items:center}
.logo{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.tier{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink2);border:1px solid var(--edge);border-radius:99px;padding:3px 8px}
.who2{display:flex;align-items:center;gap:10px;margin:12px 0 10px}
.who2 .mini{width:46px;height:46px;border-radius:14px;background:var(--blue-soft);flex:none;overflow:hidden;display:grid;place-items:center}
.who2 .mini svg{width:46px;height:46px}
.who2 b{font-size:19px;letter-spacing:-.4px;display:block;line-height:1.1}
.who2 small{font-size:11px;color:var(--ink2)}
.bento{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:5px;min-height:0}
.cell{border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative;font-size:10px;line-height:1.2}
.cell b{font-weight:700;letter-spacing:-.2px;word-break:keep-all}
.cell small{font-size:9px;opacity:.75;font-variant-numeric:tabular-nums;margin-top:2px}
.cell.c1{background:var(--ink);color:#fff;justify-content:space-between}
.cell.c1 b{font-size:26px;line-height:1.02;letter-spacing:-1px}
.cell.c1 small{font-size:12px}
.tier-3 .cell.c1 b,.tier-4 .cell.c1 b,.tier-5 .cell.c1 b{text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.6)}
.tier-4 .cell.c1{background:linear-gradient(135deg,#14171c,#243566 55%,#14171c)}
.tier-5 .cell.c1{background:linear-gradient(135deg,#1c1608,#6b5413 55%,#1c1608)}
.cell.c2{background:var(--blue);color:#fff}.cell.c2 b{font-size:15px}
.cell.c3{background:#cfdcff}.cell.c4,.cell.c5{background:#e1e9ff}.cell.c6,.cell.c7{background:#edf1fb}.cell.c8{background:#f1f3f8}
.cell.c9,.cell.c10,.cell.zero{background:transparent;border:1.5px dashed var(--edge);color:var(--ink3)}
.cell.c3 b{font-size:12px}
.cell.fill10{grid-area:4/3/5/5;flex-direction:row;align-items:center;justify-content:space-between;background:var(--soft);border:0;color:var(--ink2)}
.cell.up{animation:cup .9s}
@keyframes cup{30%{transform:scale(1.07);box-shadow:0 0 0 3px var(--blue)}}
.ff{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}
.ff .big{font-size:30px;font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.ff .big i{font-style:normal;font-size:14px;color:var(--ink2)}
.ff small{font-size:11px;color:var(--ink2);text-align:right;line-height:1.4}
.ff small b{color:var(--blue)}

/* back */
.back h4{font-size:11px;letter-spacing:.14em;color:var(--ink3);margin:16px 0 8px;font-weight:700}
.back .dir{font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1.25;margin-top:14px}
.path{display:flex;align-items:center;margin:4px 0 2px}
.stamp{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--edge);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink3);flex:none}
.stamp.on{background:var(--ink);color:#fff;border:0}
.stamp.cur{background:var(--blue);color:#fff;border:0;box-shadow:0 0 0 3px var(--blue-soft)}
.path hr{flex:1;border:0;border-top:1.5px dashed var(--edge)}
.blog{font-size:12px;display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--edge)}
.blog span:last-child{color:var(--blue);font-weight:700}
.bk{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.bk small{font-size:10px;color:var(--ink2);line-height:1.5}
.qr{width:54px;height:54px}

/* galaxy */
.gal{width:min(620px,100%);aspect-ratio:1;position:relative}
.gal svg{width:100%;height:100%;overflow:visible}
.gal text{font-family:var(--font)}
.node{transition:r .8s cubic-bezier(.2,.8,.2,1)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,10,25,.7);display:none;place-items:center;z-index:50}
.ov.show{display:grid}
.md{background:#fff;color:var(--ink);border-radius:22px;padding:28px 28px 22px;width:min(340px,90vw);text-align:center;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}}
.md .cv{width:120px;height:120px;margin:0 auto 6px}
.md .cv svg{width:100%;height:100%;overflow:visible}
.md small{color:var(--blue);font-weight:700;letter-spacing:.1em;font-size:12px}
.md h3{font-size:22px;margin:6px 0;letter-spacing:-.5px}
.md p{color:var(--ink2);font-size:14px;line-height:1.5;margin-bottom:18px}
.md button{width:100%;background:var(--blue);color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:15px}
.cf{position:fixed;top:0;width:8px;height:12px;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),100vh) rotate(720deg);opacity:.8}}
.reset{margin-top:26px;font-size:12px;color:var(--ink3);text-decoration:underline}

@media(max-width:1240px){
  body{overflow:auto}.app{display:block;height:auto}.pane{overflow:visible}
  .pane.l,.pane.m{border:0}.pane.r{min-height:900px}
}

.tier-1{--grad:linear-gradient(165deg,#e3f9ef,#c2e7ff);--b1:#8fe3c0;--b2:#ffd27a}
.tier-2{--grad:linear-gradient(165deg,#d6e6ff,#eadfff);--b1:#8fb0ff;--b2:#ffb48a}
.tier-3{--grad:linear-gradient(160deg,#ffeab8,#ffb85c 90%);--b1:#8aa8ff;--b2:#a6e3b5}
.tier-4{--grad:linear-gradient(160deg,#c3e2ff,#e0cdff 55%,#ffd3ec);--b1:#6aa8ff;--b2:#ff9ad0}
.tier-5{--grad:linear-gradient(160deg,#fff0b0,#f6c944 90%);--b1:#ffb347;--b2:#fff}
.face{background:var(--grad,var(--paper))!important}
.scene{position:relative}
.stk{position:absolute;inset:0;border-radius:18px;box-shadow:0 20px 40px -24px rgba(30,50,110,.4)}
.stk.a{background:var(--b1);transform:rotate(-5deg) translate(-9px,7px)}
.stk.b{background:var(--b2);transform:rotate(4.5deg) translate(9px,4px)}
.glow{position:absolute;left:50%;bottom:18%;width:78%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 68%);pointer-events:none}
.ft{text-align:center;margin-top:12px;position:relative}
.ft small{font-size:12px;color:rgba(20,23,28,.6);font-weight:600}
.topn{font-size:60px;font-weight:800;letter-spacing:-2.5px;line-height:1.02;font-variant-numeric:tabular-nums}
.ft h3{font-size:20px;font-weight:800;letter-spacing:-.6px;line-height:1.22;margin-top:4px}
.hero{flex:1;display:grid;place-items:center;min-height:0;position:relative}
.hero svg{width:100%;max-width:190px;height:auto;max-height:100%;filter:drop-shadow(0 14px 12px rgba(20,23,28,.2));overflow:visible}
.tops{display:grid;gap:5px;position:relative}
.trow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.6);border-radius:10px;padding:6px 9px;backdrop-filter:blur(6px)}
.trow span{width:74px;white-space:nowrap}
.trow i{flex:1;height:5px;border-radius:9px;background:rgba(20,23,28,.1);overflow:hidden}
.trow i b{display:block;height:100%;background:var(--ink);border-radius:9px}
.trow em{font-style:normal;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums;width:42px;text-align:right}
.ff2{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;font-weight:700;color:rgba(20,23,28,.55);position:relative}
.share{display:flex;gap:10px;margin-top:22px;width:min(340px,100%)}
.sb{flex:1;padding:14px 0;border-radius:99px;font-weight:700;font-size:14px}
.sb.ghost{background:rgba(20,23,28,.07)}
.sb.pri{background:var(--blue);color:#fff}
.sb.pulse{animation:pls 1.4s ease-in-out infinite}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(43,92,255,.45)}50%{box-shadow:0 0 0 10px rgba(43,92,255,0)}}
.card3d{animation:deal .8s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{opacity:0;translate:0 30px;scale:.92}}
.ov.sheet{align-items:end}
.sh{background:#fff;color:var(--ink);width:min(440px,100%);border-radius:24px 24px 0 0;padding:22px 22px 28px;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.sh b{font-size:17px}.sh p{font-size:13px;color:var(--ink2);margin:8px 0 18px;line-height:1.5;background:var(--soft);border-radius:12px;padding:12px}
.sh .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sh .g button{font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.sh .g i{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:22px;background:var(--soft)}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:#14171c;color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}

.tier-1{--grad:radial-gradient(70% 55% at 15% 8%,#b4f5d6,transparent 70%),radial-gradient(75% 60% at 95% 92%,#a6d6ff,transparent 70%),#f0fbf7}
.tier-2{--grad:radial-gradient(70% 55% at 15% 8%,#b9ccff,transparent 70%),radial-gradient(75% 60% at 95% 92%,#e2cfff,transparent 70%),#f3f6ff}
.tier-3{--grad:radial-gradient(70% 55% at 12% 6%,#ffe08e,transparent 70%),radial-gradient(80% 62% at 98% 94%,#ff9b57,transparent 72%),#fff3dc}
.tier-4{--grad:radial-gradient(70% 55% at 12% 6%,#a5d3ff,transparent 70%),radial-gradient(75% 60% at 98% 94%,#ffbfe3,transparent 70%),radial-gradient(50% 40% at 80% 20%,#dcc9ff,transparent 70%),#f4f1ff}
.tier-5{--grad:radial-gradient(70% 55% at 12% 6%,#ffe780,transparent 70%),radial-gradient(80% 62% at 98% 94%,#ffb040,transparent 72%),#fff6d8}
.face{padding:22px!important;box-shadow:0 30px 60px -26px rgba(30,50,110,.5),inset 0 1px 0 rgba(255,255,255,.9)!important}
.lb{font-size:13px;font-weight:700;color:rgba(20,23,28,.62)}
.hl{margin-top:26px;position:relative;z-index:1;text-align:left}
.topn{font-size:78px;font-weight:800;letter-spacing:-3.5px;line-height:.95;font-variant-numeric:tabular-nums;color:#14171c}
.hl p{font-size:19px;font-weight:700;letter-spacing:-.5px;margin-top:14px;color:rgba(20,23,28,.75);line-height:1.35;word-break:keep-all}
.sm{display:block;font-size:13px;font-weight:600;color:rgba(20,23,28,.55);margin-bottom:6px}
.hero{position:absolute!important;right:14px;bottom:50px;width:56%;flex:none!important;display:block!important;z-index:0}
.hero svg{width:100%;height:auto;max-width:none!important;filter:none!important;overflow:visible}
.ff3{position:absolute;left:22px;right:22px;bottom:20px;display:flex;justify-content:space-between;align-items:center;z-index:1}
.ff3 b{font-size:17px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.ff3 span{font-size:12px;font-weight:700;background:rgba(255,255,255,.65);padding:6px 11px;border-radius:99px;color:rgba(20,23,28,.7)}
.bar2{height:10px;border-radius:99px;background:rgba(20,23,28,.1);overflow:hidden;margin-top:14px}
.bar2 i{display:block;height:100%;background:#14171c;border-radius:99px}
.rc{position:absolute;left:22px;right:22px;bottom:92px;z-index:1}
.rc div{display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding:8px 0;border-bottom:1px solid rgba(20,23,28,.1)}

/* ===== Card tiers: 기본 -> 빛나는 카드 ===== */
.tier-1{--grad:linear-gradient(165deg,#ffffff,#f1f3f7);--b1:#dfe4ee;--b2:#cdd4e2}
.tier-2{--grad:radial-gradient(90% 55% at 100% 100%,#d6e3ff,transparent 70%),linear-gradient(165deg,#ffffff,#f3f6ff);--b1:#c3d4ff;--b2:#dfe4ee}
.tier-3{--grad:linear-gradient(120deg,#f8fafd 0%,#d5dbe5 26%,#fbfcfe 48%,#c4ccd8 72%,#eef1f6 100%);--b1:#b0b9c8;--b2:#d5dbe5}
.tier-4{--grad:linear-gradient(125deg,#e6f0ff 0%,#f5e4ff 24%,#dffff1 50%,#fff1da 76%,#e4ecff 100%);--b1:#a8c3ff;--b2:#ffc0e6}
.tier-5{--grad:linear-gradient(125deg,#fff3c4 0%,#f2cd63 30%,#fff0b4 50%,#e1b13a 76%,#ffe69a 100%);--b1:#e1b13a;--b2:#fff0b4}
.tier-1 .shine,.tier-2 .shine{opacity:0}
.tier-3 .shine{opacity:.28}.tier-4 .shine{opacity:.65}.tier-5 .shine{opacity:.45}
.tier-3 .face::after,.tier-4 .face::after,.tier-5 .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%);transform:translateX(-130%);animation:sw 4.5s ease-in-out infinite}
@keyframes sw{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.face{box-shadow:0 24px 44px -24px rgba(30,50,110,.45),0 0 0 1px rgba(20,23,28,.06) inset,inset 0 1px 0 rgba(255,255,255,.9)!important}
.stk{opacity:.9}
.stk.a{transform:rotate(-4deg) translate(-6px,6px)}
.stk.b{transform:rotate(3.5deg) translate(6px,4px)}

/* raise */
function raise(k,i,btn){
  if(S.busy)return;S.busy=true;
  if(btn)btn.classList.add('busy');
  setTimeout(()=>{
    const l=LEC[k][i],s=S.skills.find(x=>x.k===k),before=lvOf(total()),sb=statVals();
    s.p+=l[2];S.week+=l[2];S.gt=(S.gt||0)+l[2];if(!S.today){S.today=true;S.days=Math.min(5,S.days+1)}S.done[k+i]=1;S.log.unshift([l[0],k,'+'+l[2]]);
    const after=lvOf(total()),sa=statVals();S._delta=sa.map((v,x)=>v-sb[x]);
    renderL();renderM();
    const row=document.querySelector(`[data-p="${k}"]`);if(row)row.closest('.row').classList.add('bump');
    renderR(k);
    bubble('+'+l[2]+'P');fx(l[2]);
    S.busy=false;
    if(after.n>before.n){warp();setTimeout(()=>levelUp(after),1500)}
  },750);
}

const NEXTITEM=['','손전등','부스터 백팩','망토와 깃발','제트팩과 별 후광'];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function openSheet(ttl,pc){document.getElementById('stx').textContent='나는 '+ttl+' · 서비스 기획자 중 상위 '+pc+'% #스킬올리기';document.getElementById('sheet').classList.add('show')}

const _BBC={1:[126,77,867,1232],2:[17,81,976,1208],3:[111,70,882,1229],4:[15,106,1080,1154],5:[27,31,1060,1319]};function cardSprite(n){return {src:'chick_lv'+n+'.png?v=9',crop:_BBC[n]}}

/* ===== 이미지로 저장: 공유 카드를 PNG로 그려서 내려받기 ===== */
const CARD_GRAD={1:['#e3f9ef','#c2e7ff'],2:['#d6e6ff','#eadfff'],3:['#ffeab8','#ffb85c'],4:['#c3e2ff','#e0cdff','#ffd3ec'],5:['#fff0b0','#f6c944']};
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function buildCardCanvas(lv,t,ttl,say){
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  try{await document.fonts.load('800 100px "Pretendard Variable"');await document.fonts.load('600 40px "Pretendard Variable"')}catch(_){}
  const F='"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif';
  const st=CARD_GRAD[lv.n]||CARD_GRAD[1],g=c.createLinearGradient(0,0,W*.55,H);st.forEach((col,i)=>g.addColorStop(i/(st.length-1),col));
  c.fillStyle=g;c.fillRect(0,0,W,H);
  // 은은한 빛
  const rg=c.createRadialGradient(W*.72,H*.22,0,W*.72,H*.22,W*.7);rg.addColorStop(0,'rgba(255,255,255,.55)');rg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=rg;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(20,23,28,.6)';c.font='600 34px '+F;c.textBaseline='alphabetic';
  c.fillText('서비스 기획자 · LV.'+lv.n,84,128);
  c.fillStyle='#14171c';c.font='800 150px '+F;c.fillText('상위',80,300);
  c.font='800 250px '+F;c.fillText(pct(t)+'%',72,520);
  c.font='800 58px '+F;c.fillText(ttl+josa(ttl),84,606);
  // 캐릭터
  const sp=cardSprite(lv.n),img=await loadImg(sp.src),crop=sp.crop||[0,0,img.naturalWidth,img.naturalHeight];
  const ph=560,pw=ph*crop[2]/crop[3],cx=400,base=1196;
  c.save();c.fillStyle='rgba(27,42,82,.16)';c.beginPath();c.ellipse(cx,base+8,pw*.34,22,0,0,Math.PI*2);c.fill();c.restore();
  c.drawImage(img,crop[0],crop[1],crop[2],crop[3],cx-pw/2,base-ph,pw,ph);
  // 말풍선
  const lines=say.replace(/<br>/g,'\n').split('\n');c.font='700 34px '+F;
  const bw=Math.max(...lines.map(l=>c.measureText(l).width))+64,bh=lines.length*50+40,bx=W-84-bw,by=700;
  c.save();c.shadowColor='rgba(20,23,28,.14)';c.shadowBlur=24;c.shadowOffsetY=8;c.fillStyle='#fff';rr(c,bx,by,bw,bh,28);c.fill();c.restore();
  c.fillStyle='#fff';c.beginPath();c.moveTo(bx+40,by+bh-2);c.lineTo(bx+16,by+bh+34);c.lineTo(bx+84,by+bh-2);c.fill();
  c.fillStyle='#14171c';lines.forEach((l,i)=>c.fillText(l,bx+32,by+20+42+i*50));
  // 하단: 포인트 + 카드 이름
  c.fillStyle='#14171c';c.font='800 64px '+F;c.fillText(fmt(t)+'P',84,1284);
  c.font='700 30px '+F;const tw=c.measureText(lv.tier).width+56;
  c.fillStyle='rgba(255,255,255,.75)';rr(c,W-84-tw,1236,tw,64,32);c.fill();
  c.fillStyle='#14171c';c.fillText(lv.tier,W-84-tw+28,1278);
  c.fillStyle='rgba(20,23,28,.4)';c.font='600 26px '+F;c.fillText('#스킬올리기',84,1326);
  return cv;
}
async function saveCard(lv,t,ttl,say){

/* ===== 몰입 연출: 별가루 흡수 / 워프 ===== */
function fx(g){
  const st=document.querySelector('.h2st'),ck=document.querySelector('.h2chick');if(!st||!ck)return;
  const sr=st.getBoundingClientRect(),cr=ck.getBoundingClientRect();if(!sr.width)return;
  const cx=cr.left+cr.width/2-sr.left,cy=cr.top+cr.height*.5-sr.top,n=Math.min(24,10+Math.round(g/4));
  for(let i=0;i<n;i++){
    const e=document.createElement('i');e.className='fxs';
    const a=Math.random()*Math.PI*2,rad=sr.width*(.38+Math.random()*.32),x0=cx+Math.cos(a)*rad,y0=cy+Math.sin(a)*rad*.85;
    e.style.cssText='left:'+x0+'px;top:'+y0+'px;--s:'+(6+Math.random()*10)+'px';
    st.appendChild(e);
    const an=e.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.2},{transform:'translate('+(cx-x0)+'px,'+(cy-y0)+'px) translate(-50%,-50%) scale(.25)',opacity:.95}],{duration:800+Math.random()*500,delay:Math.random()*250,easing:'cubic-bezier(.45,0,.75,.55)',fill:'forwards'});
    an.onfinish=()=>e.remove();
  }
  setTimeout(()=>{ck.classList.remove('flash');void ck.offsetWidth;ck.classList.add('flash')},950);
}

/* ===== 움직이는 배경: 별 반짝임 · 유성 · 떠다니는 빛 · 천천히 숨쉬는 배경 · 마우스 시차 ===== */
function fxHTML(n){
  let r=n*9301+49297;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
  let h='<div class="h2fx">';
  const cnt=n>=5?46:n>=4?40:34;
  for(let i=0;i<cnt;i++){
    const big=i%7===0,x=rnd()*100,y=rnd()*(big?62:78),s=big?(9+rnd()*8):(2+rnd()*2.6);
    h+=`<i class="${big?'sp4':''}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;--s:${s.toFixed(1)}px;--t:${(2.6+rnd()*3.6).toFixed(1)}s;--d:-${(rnd()*6).toFixed(1)}s"></i>`;
  }
  for(let i=0;i<7;i++){
    h+=`<i class="dust" style="left:${(8+rnd()*84).toFixed(1)}%;--s:${(2+rnd()*3).toFixed(1)}px;--t:${(11+rnd()*9).toFixed(1)}s;--d:-${(rnd()*14).toFixed(1)}s"></i>`;
  }
  h+='<b style="--d:2s"></b><b class="b2" style="--d:7.5s"></b></div>';
  return h;
}
(function(){
  let raf=0;
  document.addEventListener('mousemove',e=>{
    if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
      const st=document.querySelector('.h2st');if(!st)return;const b=st.getBoundingClientRect();if(!b.width)return;
      const x=Math.max(-1,Math.min(1,((e.clientX-b.left)/b.width-.5)*2)),y=Math.max(-1,Math.min(1,((e.clientY-b.top)/b.height-.5)*2));
      st.style.setProperty('--px',x.toFixed(3));st.style.setProperty('--py',y.toFixed(3));
    });
  });
  document.addEventListener('mouseleave',()=>{const st=document.querySelector('.h2st');if(st){st.style.setProperty('--px',0);st.style.setProperty('--py',0)}});
})();
function warp(){
  const st=document.querySelector('.h2st');if(!st)return;
  const w=document.createElement('div');w.className='warp';st.appendChild(w);setTimeout(()=>w.remove(),1400);
  const f=st.querySelector('.h2full');if(f){f.classList.add('arrive');setTimeout(()=>f.classList.remove('arrive'),1400)}
}
renderL();renderM();renderR();
</script>
